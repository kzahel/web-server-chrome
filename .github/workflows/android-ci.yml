name: Android CI

on:
  push:
    branches: [main]
    tags:
      - 'android-v*'
    paths:
      - 'android/**'
      - 'tests/http-conformance/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/http-conformance/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android source checks
        run: scripts/check.sh

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && ./gradlew connectedDebugAndroidTest

  release-android:
    needs: [build-android, instrumented-tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android-v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag, app version, and changelog
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test "$APP_VERSION" = "$VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md

      - name: Decode upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app/signing/upload.keystore

      - name: Build Release APK and AAB
        env:
          UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/app/signing/upload.keystore
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Compress Mapping File
        run: gzip -k app/build/outputs/mapping/release/mapping.txt

      - name: Upload Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt.gz

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md
          else
            echo "Release $VERSION" > /tmp/release-notes.md
          fi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: /tmp/release-notes.md
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt.gz

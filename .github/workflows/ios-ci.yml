name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'tests/http-conformance/**'
      - 'tests/compatibility/**'
      - 'scripts/release-check.sh'
      - 'scripts/release-ios.sh'
      - '.github/workflows/ios-ci.yml'
      - '.github/workflows/ios-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'tests/http-conformance/**'
      - 'tests/compatibility/**'
      - 'scripts/release-check.sh'
      - 'scripts/release-ios.sh'
      - '.github/workflows/ios-ci.yml'
      - '.github/workflows/ios-release.yml'

jobs:
  check-ios:
    runs-on: macos-26
    env:
      IOS_SIMULATOR_NAME: 200OK-CI-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Install project and source-check tools
        run: brew install xcodegen ripgrep

      - name: Boot a fresh Simulator before source UI tests
        run: |
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/ios-runtimes.json"
          runtime="$(python3 -c 'import json,sys; rows=[r for r in json.load(open(sys.argv[1]))["runtimes"] if r.get("isAvailable") and r["name"].startswith("iOS ")]; print(max(rows,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])' "$RUNNER_TEMP/ios-runtimes.json")"
          simulator="$(xcrun simctl create "$IOS_SIMULATOR_NAME" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          echo "IOS_SOURCE_SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b

      - name: Run iOS source checks
        run: ios/scripts/check.sh

      - name: Run App Store archive preflight
        run: ios/scripts/release-archive.sh --check

      - name: Smoke production Release through Files and native UI
        run: ios/scripts/release-simulator-smoke.sh

      - name: Reject generated project drift
        run: git diff --exit-code -- ios/OK200.xcodeproj

      - name: Upload failed test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-result
          path: ios/build/CheckDerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore

      - name: Upload Release smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-smoke
          path: |
            ios/build/release-smoke.*/Smoke.xcresult
            ios/build/release-smoke.*/*.log
            ios/build/release-smoke.*/artifact-inspection.txt
            ios/build/release-smoke.*/result.txt
          if-no-files-found: ignore

      - name: Remove source-check Simulator
        if: always() && env.IOS_SOURCE_SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$IOS_SOURCE_SIMULATOR_ID" || true
          xcrun simctl delete "$IOS_SOURCE_SIMULATOR_ID"

name: Android Play Rollout

# Changes a production staged rollout. Halt skips approval so a bad rollout
# can stop at once; every other action needs production approval.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Android release tag (android-vX.Y.Z) of the staged rollout
        required: true
        type: string
      action:
        description: set raises the fraction; halt stops new installs; resume restarts; complete releases to everyone
        type: choice
        options: [set, halt, resume, complete]
      fraction:
        description: set, or optionally resume. User fraction, such as 0.2
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-play
  cancel-in-progress: false

jobs:
  rollout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.action == 'halt' && 'android-play-halt' || 'android-play-production' }}
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate with short-lived Google credentials
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.ANDROID_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Change the rollout through one Play edit
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ACTION: ${{ inputs.action }}
          FRACTION: ${{ inputs.fraction }}
        run: |
          python3 scripts/android-play.py rollout --tag "$TAG" --action "$ACTION" --fraction "$FRACTION" \
            --receipt "$RUNNER_TEMP/rollout.json"
          { echo '```json'; cat "$RUNNER_TEMP/rollout.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: play-rollout-${{ inputs.tag }}-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollout.json
          if-no-files-found: ignore

name: Extension CI

on:
  push:
    branches: [main]
    tags:
      - 'extension-v*'
    paths:
      - 'extension/**'
      - 'pnpm-lock.yaml'
      - 'scripts/package-extension.sh'
      - 'scripts/validate-extension-package.mjs'
      - 'tests/compatibility/**'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - 'pnpm-lock.yaml'
      - 'scripts/package-extension.sh'
      - 'scripts/validate-extension-package.mjs'
      - 'tests/compatibility/**'
      - '.github/workflows/extension-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extension source and package checks
        run: scripts/check.sh

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show browser version
        run: google-chrome --version

      - name: Exercise inspected package in Chrome
        run: scripts/browser-check.sh

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-browser-smoke-${{ github.run_id }}
          path: extension/browser-artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, browser-smoke]
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and inspect store-safe package
        run: ../scripts/package-extension.sh "$PWD/ok200-extension.zip"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#extension-v}" >> $GITHUB_OUTPUT

      - name: Verify package version and write checksum
        run: |
          node ../scripts/validate-extension-package.mjs ok200-extension.zip \
            --expected-version "${GITHUB_REF_NAME#extension-v}"
          sha256sum ok200-extension.zip > ok200-extension.zip.sha256

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#extension-v}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md
          echo "Release notes for $VERSION:"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Extension v${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release-notes.md
          files: |
            extension/ok200-extension.zip
            extension/ok200-extension.zip.sha256

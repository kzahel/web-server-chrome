name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s scripts -p 'test_android*.py'
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node --test tests/http-conformance/validate.test.mjs
      - run: node --test tests/compatibility/validate.test.mjs
      - run: node --test .github/scripts/write-crostini-release-manifest.test.mjs
      - name: Validate Linux launcher metadata
        run: |
          bash -n website/public/install.sh website/public/install-crostini.sh
          grep -Fxq 'Name=200 OK Web Server' website/public/install.sh
          grep -Fxq 'GenericName=Web Server' website/public/install.sh
          grep -Fxq 'Keywords=web;server;HTTP;local;development;' website/public/install.sh
      - run: scripts/test-crostini-installer.sh

name: OK200ReleaseSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  ReleaseSmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ok200.ios.release-smoke
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReleaseSmoke:
    build:
      targets:
        ReleaseSmokeUITests: [test]
    test:
      config: Release
      targets: [ReleaseSmokeUITests]

name: Tauri App CI

on:
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/scripts/**'
      - '.github/workflows/tauri-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/scripts/**'
      - '.github/workflows/tauri-app-ci.yml'

permissions:
  contents: write

jobs:
  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Test release validation
        run: node --test .github/scripts/validate-desktop-release.test.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

      - name: Lint native Rust crates
        working-directory: desktop
        run: cargo clippy -p ok200-core -p ok200-common -p ok200-host --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: desktop
        run: cargo test -p ok200-core -p ok200-host -p ok200-common

  build-tauri:
    strategy:
      fail-fast: false
      # tauri-action updates the shared draft release and latest.json from each
      # platform leg. Its existing-assets snapshot is not safe for concurrent
      # replacement: parallel tagged jobs can both decide to upload latest.json
      # and one fails with ReleaseAsset already_exists. Serialize the matrix so
      # every platform merges and replaces updater metadata deterministically.
      max-parallel: 1
      matrix:
        include:
          # macos-latest is mid-migration to macOS 26 (runner-images#14167, rolling
          # out 2026-06-15 → ~2026-07-15), so during the window it is a coin-flip
          # between the 15 and 26 images. Pin the runner to macos-26 for deterministic
          # signing/notarization. `platform: macos-latest` stays as the discriminator
          # the `if:` steps key on; `runner` controls the image. Bump to macos-27 after
          # a test build when announced.
          - platform: macos-latest
            runner: macos-26
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            runner: macos-26
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          # GitHub's ARM64 Linux runners are free for public repositories. Keep
          # the 22.04 image so both Linux legs link against the same glibc
          # baseline.
          - platform: ubuntu-22.04-arm
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.runner || matrix.platform }}

    env:
      HAS_UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_KEYCHAIN_PASSWORD != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Require release signing credentials
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          if [ "$HAS_UPDATER_SIGNING" != "true" ]; then
            echo "::error::Tagged releases require TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [ "$RUNNER_OS" = "macOS" ] && { [ "$HAS_MACOS_SIGNING" != "true" ] || [ "$HAS_MACOS_NOTARIZATION" != "true" ]; }; then
            echo "::error::Tagged macOS releases require signing and notarization credentials"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WINDOWS_SIGNING" != "true" ]; then
            echo "::error::Tagged Windows releases require trusted-signing credentials"
            exit 1
          fi

      # --- Node.js + pnpm ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # --- Rust ---
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      # --- Linux system dependencies ---
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils

      # --- macOS code signing ---
      - name: Set up macOS code signing keychain
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Set up macOS notarization credentials
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Inject multiline and metacharacter-bearing signing values without
      # reparsing them through the shell. Keep absent secrets out of the
      # environment entirely so fork builds can take the unsigned path.
      - name: Set signing environment
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          emit() {
            {
              printf '%s<<__OK200EOF__\n' "$1"
              printf '%s\n' "$2"
              printf '__OK200EOF__\n'
            } >> "$GITHUB_ENV"
          }

          if [ -n "$UPDATER_KEY" ]; then
            emit TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY"
            emit TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_PASSWORD"
          fi
          if [ -n "$MACOS_CERTIFICATE" ] && [ "${{ matrix.platform }}" = "macos-latest" ]; then
            emit APPLE_CERTIFICATE "$MACOS_CERTIFICATE"
            emit APPLE_CERTIFICATE_PASSWORD "$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Kyle Graehl (VD7BYQ6ABM)" >> "$GITHUB_ENV"
          fi
          if [ -n "$ASC_API_KEY_ID" ] && [ "${{ matrix.platform }}" = "macos-latest" ]; then
            emit APPLE_API_KEY "$ASC_API_KEY_ID"
            emit APPLE_API_ISSUER "$ASC_API_ISSUER_ID"
          fi

      # --- Windows signing tool ---
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install trusted-signing-cli

      # --- Build sidecar ---
      - name: Build sidecar
        shell: bash
        working-directory: desktop
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET="${{ matrix.rust_target }}"
            cargo build --release -p ok200-host --target "$TARGET"
            mkdir -p tauri-app/src-tauri/binaries
            if [[ "$TARGET" == *"windows"* ]]; then
              cp "target/$TARGET/release/ok200-host.exe" "tauri-app/src-tauri/binaries/ok200-host-$TARGET.exe"
            else
              cp "target/$TARGET/release/ok200-host" "tauri-app/src-tauri/binaries/ok200-host-$TARGET"
            fi
          else
            TRIPLE="$(rustc --print host-tuple)"
            cargo build --release -p ok200-host
            mkdir -p tauri-app/src-tauri/binaries
            if [ "${{ matrix.platform }}" = "windows-latest" ]; then
              cp "target/release/ok200-host.exe" "tauri-app/src-tauri/binaries/ok200-host-$TRIPLE.exe"
            else
              cp "target/release/ok200-host" "tauri-app/src-tauri/binaries/ok200-host-$TRIPLE"
            fi
          fi

      # --- Install frontend dependencies ---
      - name: Install frontend dependencies
        run: pnpm install

      # --- Extract changelog ---
      - name: Extract changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" desktop/tauri-app/CHANGELOG.md 2>/dev/null || true)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # --- Build Tauri app ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows signing
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: desktop/tauri-app
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'desktop-v__VERSION__' || '' }}
          releaseName: '200 OK v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.notes || 'See the assets to download and install this version.' }}
          releaseDraft: true
          prerelease: false
          # tauri-action v0 calls this input assetNamePattern. Version 1 renamed
          # it to releaseAssetNamePattern.
          assetNamePattern: ${{ matrix.platform == 'windows-latest' && '200.OK_[version]_[arch][setup][ext]' || '' }}
          includeUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/') }}
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: >-
            ${{ matrix.args }}
            ${{ matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING != 'true' && '--no-sign' || '' }}
            ${{ env.HAS_UPDATER_SIGNING != 'true' && '--config ''{"bundle":{"createUpdaterArtifacts":false}}''' || '' }}
            ${{ matrix.platform == 'windows-latest' && secrets.AZURE_CLIENT_SECRET != '' && '--config ''{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a kylegraehl -c jstorrent-profile %1"}}}''' || '' }}

      - name: Verify macOS bundle identity
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP_PATH="desktop/target/${{ matrix.rust_target }}/release/bundle/macos/200 OK Web Server.app"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"

          test -d "$APP_PATH"
          test "$(plutil -extract CFBundleDisplayName raw "$INFO_PLIST")" = "200 OK Web Server"
          test "$(plutil -extract CFBundleName raw "$INFO_PLIST")" = "200 OK"
          test "$(plutil -extract CFBundleIdentifier raw "$INFO_PLIST")" = "app.ok200.desktop"

      - name: Verify macOS app signing and notarization
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARIZATION == 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./desktop/tauri-app/src-tauri/tauri.conf.json').version")"
          if [ "${{ matrix.rust_target }}" = "aarch64-apple-darwin" ]; then
            ARCH="aarch64"
          else
            ARCH="x64"
          fi
          APP_PATH="desktop/target/${{ matrix.rust_target }}/release/bundle/macos/200 OK Web Server.app"
          DMG_PATH="desktop/target/${{ matrix.rust_target }}/release/bundle/dmg/200 OK Web Server_${VERSION}_${ARCH}.dmg"

          test -d "$APP_PATH"
          test -f "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(
            @(Get-ChildItem 'desktop/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
            @(Get-ChildItem 'desktop/target/release/bundle/msi' -Filter '*.msi' -File)
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one NSIS EXE and one MSI, found $($artifacts.Count)"
          }

          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            Write-Host "$($artifact.Name): $($signature.Status) / $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') {
              throw "$($artifact.Name) does not have a valid Authenticode signature"
            }
            if ($signature.SignerCertificate.Subject -notmatch 'CN=Kyle Graehl(?:,|$)') {
              throw "$($artifact.Name) has unexpected signer $($signature.SignerCertificate.Subject)"
            }
          }

      # --- Build macOS .pkg installer ---
      - name: Build macOS .pkg installer
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          INSTALLER_IDENTITY: "${{ env.HAS_MACOS_SIGNING == 'true' && 'Developer ID Installer: Kyle Graehl (VD7BYQ6ABM)' || '' }}"
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          TARGET="${{ matrix.rust_target }}"
          if [ "$TARGET" = "aarch64-apple-darwin" ]; then
            ARCH="aarch64"
          else
            ARCH="x64"
          fi
          APP_PATH="desktop/target/$TARGET/release/bundle/macos/200 OK Web Server.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Could not find required app bundle at $APP_PATH"
            find desktop/target -maxdepth 6 -type d -name '*.app' -print || true
            exit 1
          fi
          bash desktop/tauri-app/scripts/build-macos-pkg.sh "$APP_PATH" "$VERSION" "$ARCH"
          PKG_FILE="200_OK_${VERSION}_${ARCH}.pkg"
          test -f "$PKG_FILE"
          echo "PKG_FILE=$PKG_FILE" >> "$GITHUB_ENV"

      # --- Notarize .pkg ---
      - name: Notarize .pkg
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/desktop-v') && env.PKG_FILE != ''
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "$PKG_FILE" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$PKG_FILE"
          xcrun stapler validate "$PKG_FILE"
          pkgutil --check-signature "$PKG_FILE"
          spctl --assess --type install --verbose=2 "$PKG_FILE"

      - name: Upload notarized .pkg to draft release
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/desktop-v') && env.PKG_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" "$PKG_FILE" --clobber

      # --- Diagnose flaky DMG bundling ---
      - name: Check for flaky DMG bundling failure
        if: failure() && matrix.platform == 'macos-latest'
        run: |
          echo ""
          echo "::error::macOS packaging failed. Inspect the failing build, signing, PKG, or notarization step before rerunning: gh run rerun ${{ github.run_id }} --failed"

      # --- Cleanup ---
      - name: Clean up macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true

  # A matrix leg may create the draft, but only this job can publish it.
  finalize-release:
    if: always() && startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - test-desktop
      - build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep failed builds private
        if: needs.test-desktop.result != 'success' || needs.build-tauri.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft
            echo "::error::One or more required jobs failed; $TAG remains a draft"
          else
            echo "::error::One or more required jobs failed; no release was created"
          fi
          exit 1

      - name: Download and validate complete draft release
        if: needs.test-desktop.result == 'success' && needs.build-tauri.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_DIR="${RUNNER_TEMP}/desktop-release"
          mkdir -p "$RELEASE_DIR"

          gh release view "$TAG" \
            --json tagName,isDraft,assets \
            > "$RELEASE_DIR/release.json"
          gh release download "$TAG" \
            --pattern latest.json \
            --dir "$RELEASE_DIR"

          node .github/scripts/validate-desktop-release.mjs \
            --release "$RELEASE_DIR/release.json" \
            --latest "$RELEASE_DIR/latest.json" \
            --tag "$TAG" \
            --repository "$REPO"

          node .github/scripts/write-release-checksums.mjs \
            "$RELEASE_DIR/release.json" \
            "$RELEASE_DIR/SHA256SUMS"
          gh release upload "$TAG" "$RELEASE_DIR/SHA256SUMS" --clobber

      - name: Remove detached updater signatures
        if: needs.test-desktop.result == 'success' && needs.build-tauri.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          while read -r name; do
            if [ -n "$name" ]; then
              echo "Deleting $name after latest.json validation"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".sig"))')

      - name: Write exact download links
        if: needs.test-desktop.result == 'success' && needs.build-tauri.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          CHANGELOG=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" desktop/tauri-app/CHANGELOG.md 2>/dev/null || true)

          {
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            echo "## Download"
            echo ""
            echo "| Platform | |"
            echo "|----------|-|"
            echo "| macOS (Apple Silicon) | [PKG](${BASE}/200_OK_${VERSION}_aarch64.pkg) (recommended) · [DMG](${BASE}/200.OK.Web.Server_${VERSION}_aarch64.dmg) |"
            echo "| macOS (Intel) | [PKG](${BASE}/200_OK_${VERSION}_x64.pkg) (recommended) · [DMG](${BASE}/200.OK.Web.Server_${VERSION}_x64.dmg) |"
            echo "| Windows | [EXE](${BASE}/200.OK_${VERSION}_x64-setup.exe) (recommended) · [MSI](${BASE}/200.OK_${VERSION}_x64.msi) (system-wide) |"
            echo "| Linux (x86_64) | [AppImage](${BASE}/200.OK_${VERSION}_amd64.AppImage) (recommended, no admin) · [DEB](${BASE}/200.OK_${VERSION}_amd64.deb) (system package) · [RPM](${BASE}/200.OK-${VERSION}-1.x86_64.rpm) (system package) |"
            echo "| Linux (ARM64) | [AppImage](${BASE}/200.OK_${VERSION}_aarch64.AppImage) (recommended, no admin) · [DEB](${BASE}/200.OK_${VERSION}_arm64.deb) (system package) · [RPM](${BASE}/200.OK-${VERSION}-1.aarch64.rpm) (system package) |"
            echo ""
            echo "[SHA-256 checksums](${BASE}/SHA256SUMS)"
          } > /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md

      - name: Publish validated release
        if: needs.test-desktop.result == 'success' && needs.build-tauri.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

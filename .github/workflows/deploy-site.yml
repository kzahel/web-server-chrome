name: Deploy Site

on:
  push:
    branches: [main]
    paths: [website/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Validate Linux installer
        run: |
          bash -n website/public/install.sh website/public/install-crostini.sh
          grep -Fxq 'Name=200 OK Web Server' website/public/install.sh
          grep -Fxq 'GenericName=Web Server' website/public/install.sh
          grep -Fxq 'Keywords=web;server;HTTP;local;development;' website/public/install.sh
          scripts/test-crostini-installer.sh
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ok200-website build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

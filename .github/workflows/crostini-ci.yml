name: ChromeOS Linux CI

on:
  push:
    branches: [main]
    tags:
      - 'crostini-v*'
    paths:
      - 'desktop/Cargo.toml'
      - 'desktop/Cargo.lock'
      - 'desktop/core/**'
      - 'desktop/crostini/**'
      - 'extension/public/icons/ok-128.png'
      - 'website/public/install-crostini.sh'
      - 'scripts/release-crostini.sh'
      - 'scripts/test-crostini-installer.sh'
      - '.github/scripts/write-crostini-release-manifest.mjs'
      - '.github/scripts/write-crostini-release-manifest.test.mjs'
      - '.github/workflows/crostini-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/Cargo.toml'
      - 'desktop/Cargo.lock'
      - 'desktop/core/**'
      - 'desktop/crostini/**'
      - 'extension/public/icons/ok-128.png'
      - 'website/public/install-crostini.sh'
      - 'scripts/release-crostini.sh'
      - 'scripts/test-crostini-installer.sh'
      - '.github/scripts/write-crostini-release-manifest.mjs'
      - '.github/scripts/write-crostini-release-manifest.test.mjs'
      - '.github/workflows/crostini-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate tag, source version, and changelog
        if: startsWith(github.ref, 'refs/tags/crostini-v')
        run: |
          VERSION="${GITHUB_REF_NAME#crostini-v}"
          SOURCE_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' desktop/crostini/Cargo.toml)
          test "$VERSION" = "$SOURCE_VERSION"
          grep -q "^## \[$VERSION\]" desktop/crostini/CHANGELOG.md
      - name: Run Crostini source and installer checks
        run: desktop/crostini/scripts/check.sh

  build:
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: crostini-${{ matrix.target }}
      - name: Install pinned cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.0
      - name: Build static release binary
        working-directory: desktop
        run: cargo zigbuild --locked --release -p ok200-crostini --target "${{ matrix.target }}"
      - name: Stage and inspect artifact
        run: |
          ASSET="ok200-crostini-${{ matrix.arch }}-unknown-linux-musl"
          cp "desktop/target/${{ matrix.target }}/release/ok200-crostini" "$ASSET"
          chmod 755 "$ASSET"
          file "$ASSET" | tee "$ASSET.file.txt"
          if ! file "$ASSET" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::$ASSET is not statically linked"
            exit 1
          fi
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            "./$ASSET" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ok200-crostini-${{ matrix.arch }}
          path: |
            ok200-crostini-${{ matrix.arch }}-unknown-linux-musl
            ok200-crostini-${{ matrix.arch }}-unknown-linux-musl.file.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/crostini-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ok200-crostini-*
          path: release
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install signing CLI
        run: pnpm install --frozen-lockfile
      - name: Restore executable artifact modes
        run: chmod 755 release/ok200-crostini-*-unknown-linux-musl
      - name: Generate and sign canonical release manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          VERSION="${GITHUB_REF_NAME#crostini-v}"
          MANIFEST="$GITHUB_WORKSPACE/release/ok200-crostini-release.manifest"
          SIGNING_INPUT="$RUNNER_TEMP/ok200-crostini-release.manifest"
          node .github/scripts/write-crostini-release-manifest.mjs \
            "$VERSION" "$GITHUB_SHA" \
            release/ok200-crostini-x86_64-unknown-linux-musl \
            release/ok200-crostini-aarch64-unknown-linux-musl \
            "$MANIFEST"
          cp "$MANIFEST" "$SIGNING_INPUT"
          pnpm --filter @ok200/desktop tauri signer sign "$SIGNING_INPUT"
          base64 --decode "$SIGNING_INPUT.sig" \
            > release/ok200-crostini-release.manifest.minisig
      - name: Verify signature, checksums, versions, and exact asset set
        run: |
          VERSION="${GITHUB_REF_NAME#crostini-v}"
          cargo build --locked --manifest-path desktop/Cargo.toml -p ok200-crostini
          VALIDATOR=desktop/target/debug/ok200-crostini
          for ARCH in x86_64 aarch64; do
            "$VALIDATOR" verify-release \
              release/ok200-crostini-release.manifest \
              release/ok200-crostini-release.manifest.minisig \
              "release/ok200-crostini-${ARCH}-unknown-linux-musl" \
              "$ARCH"
          done
          test "$(release/ok200-crostini-x86_64-unknown-linux-musl --version)" \
            = "ok200-crostini $VERSION"
          find release -maxdepth 1 -type f \
            ! -name '*.file.txt' -printf '%f\n' | sort > /tmp/assets.actual
          cat > /tmp/assets.expected <<'EOF'
          ok200-crostini-aarch64-unknown-linux-musl
          ok200-crostini-release.manifest
          ok200-crostini-release.manifest.minisig
          ok200-crostini-x86_64-unknown-linux-musl
          EOF
          diff -u /tmp/assets.expected /tmp/assets.actual
          (
            cd release
            sha256sum \
              ok200-crostini-aarch64-unknown-linux-musl \
              ok200-crostini-release.manifest \
              ok200-crostini-release.manifest.minisig \
              ok200-crostini-x86_64-unknown-linux-musl \
              > SHA256SUMS
          )
      - name: Create fail-closed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#crostini-v}"
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found" \
            desktop/crostini/CHANGELOG.md > /tmp/crostini-release-notes.md
          {
            cat /tmp/crostini-release-notes.md
            echo
            echo '## ChromeOS Linux installation'
            echo
            echo '```sh'
            echo 'curl -fsSL https://ok200.app/install-crostini.sh | bash'
            echo '```'
            echo
            echo 'The installer verifies the signed release manifest and selected static binary before changing the per-user installation.'
          } > /tmp/crostini-release-body.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest=false \
            --title "200 OK ChromeOS Linux v$VERSION" \
            --notes-file /tmp/crostini-release-body.md \
            release/ok200-crostini-aarch64-unknown-linux-musl \
            release/ok200-crostini-release.manifest \
            release/ok200-crostini-release.manifest.minisig \
            release/ok200-crostini-x86_64-unknown-linux-musl \
            release/SHA256SUMS

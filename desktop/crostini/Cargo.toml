[package]
name = "ok200-crostini"
version = "0.1.3"
edition.workspace = true
description = "ChromeOS Linux launcher and controller for 200 OK Web Server"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
dirs = { workspace = true }
fs2 = "0.4.3"
minisign-verify = "0.2.5"
ok200-core = { path = "../core" }
semver = { version = "1.0.27", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
fontdue = "0.9.3"
x11rb = { version = "0.13.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

name: Extension CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a package or check Web Store authentication without store writes
        type: choice
        options: [package, check]
        default: package
  push:
    branches: [main]
    tags:
      - 'extension-v*'
    paths:
      - 'extension/**'
      - 'pnpm-lock.yaml'
      - 'scripts/package-extension.sh'
      - 'scripts/validate-extension-package.mjs'
      - 'scripts/record-extension-build.mjs'
      - 'scripts/publish-extension-store.test.mjs'
      - 'tests/compatibility/**'
      - 'scripts/release-extension.sh'
      - 'scripts/release-check.sh'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - 'pnpm-lock.yaml'
      - 'scripts/package-extension.sh'
      - 'scripts/validate-extension-package.mjs'
      - 'scripts/record-extension-build.mjs'
      - 'scripts/publish-extension-store.test.mjs'
      - 'tests/compatibility/**'
      - 'scripts/release-extension.sh'
      - 'scripts/release-check.sh'
      - '.github/workflows/extension-ci.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extension source and package checks
        run: scripts/check.sh

      - name: Build and record the exact store candidate
        run: |
          mkdir -p ../store-candidate
          ../scripts/package-extension.sh ../store-candidate/ok200-extension.zip
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node ../scripts/validate-extension-package.mjs ../store-candidate/ok200-extension.zip --expected-version "${GITHUB_REF_NAME#extension-v}"
            grep -Fq "## [${GITHUB_REF_NAME#extension-v}]" CHANGELOG.md
          fi
          node ../scripts/record-extension-build.mjs ../store-candidate/ok200-extension.zip ../store-candidate/build.json
          test "$(node -p "require('../store-candidate/build.json').sourceDirty")" = false
          cd ../store-candidate
          sha256sum ok200-extension.zip > ok200-extension.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-store-candidate
          path: store-candidate/*
          if-no-files-found: error
          retention-days: 30

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show browser version
        run: google-chrome --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-store-candidate
          path: store-candidate

      - name: Exercise inspected package in Chrome
        env:
          OK200_EXTENSION_ZIP: ${{ github.workspace }}/store-candidate/ok200-extension.zip
        run: scripts/browser-check.sh

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-browser-smoke-${{ github.run_id }}
          path: extension/browser-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Submit to Chrome Web Store
    if: github.repository == 'kzahel/web-server-chrome' && startsWith(github.ref, 'refs/tags/extension-v')
    needs: [build, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-store-candidate
          path: store-candidate
      - name: Authenticate without a service-account key
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit the verified ZIP for automatic publication after review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node extension/scripts/publish-store.mjs publish store-candidate store-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: chrome-web-store-receipt
          path: store-receipt.json
          if-no-files-found: ignore

  check-publishing:
    name: Verify Web Store authentication (read only)
    if: github.repository == 'kzahel/web-server-chrome' && github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Authenticate without a service-account key
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Read store status and verify identity
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node extension/scripts/publish-store.mjs check . store-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chrome-web-store-status
          path: store-receipt.json

  release:
    needs: [build, browser-smoke, publish]
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-store-candidate
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chrome-web-store-receipt
          path: release
      - name: Record the submitted store release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#extension-v}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" extension/CHANGELOG.md > /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<'NOTES'

          Submitted to the Chrome Web Store for automatic publication after Google's review. A successful workflow and GitHub release establish submission, not completed review or installed-copy acceptance.

          The attached ZIP is the exact package accepted by the source and real-browser checks. Its checksum, source build record and store receipt are attached. Listing and privacy changes still require the developer dashboard.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --latest=false \
              --title "Extension v$VERSION" --notes-file /tmp/release-notes.md
          fi

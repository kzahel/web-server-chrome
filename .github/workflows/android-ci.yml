name: Android CI

on:
  push:
    branches: [main]
    tags:
      - 'android-v*'
    paths:
      - 'android/**'
      - 'tests/http-conformance/**'
      - 'tests/compatibility/**'
      - 'scripts/release-android.sh'
      - 'scripts/android-play.py'
      - 'scripts/test_android_play.py'
      - 'scripts/test_android_release.py'
      - '.github/workflows/android-play-*.yml'
      - 'scripts/release-check.sh'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/http-conformance/**'
      - 'tests/compatibility/**'
      - 'scripts/release-android.sh'
      - 'scripts/android-play.py'
      - 'scripts/test_android_play.py'
      - 'scripts/test_android_release.py'
      - '.github/workflows/android-play-*.yml'
      - 'scripts/release-check.sh'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Test Play publisher and release policy
        run: python3 -m unittest discover -s ../scripts -p 'test_android*.py'

      - name: Run Android source checks
        run: scripts/check.sh

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && ./gradlew connectedDebugAndroidTest

  release-android:
    permissions:
      contents: write
    needs: [build-android, instrumented-tests]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/android-v')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Verify tag, app version, and changelog
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test "$APP_VERSION" = "$VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md

      - name: Decode upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app/signing/upload.keystore

      - name: Build Release APK and AAB
        env:
          UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/app/signing/upload.keystore
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Compress Mapping File
        run: gzip -k app/build/outputs/mapping/release/mapping.txt

      - name: Install pinned Bundletool
        run: |
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-1.18.1.jar"
          curl -fsSL -o "$BUNDLETOOL_JAR" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo "675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  $BUNDLETOOL_JAR" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$BUNDLETOOL_JAR" >> "$GITHUB_ENV"

      - name: Inspect exact Release APK and AAB
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          scripts/verify-release-artifacts.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt.gz \
            "$VERSION" "$VERSION_CODE" "$BUNDLETOOL_JAR" \
            app/build/outputs/release-verification

      - name: Enable KVM for Release smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke exact Release APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && scripts/smoke-release-apk.sh app/build/outputs/apk/release/app-release.apk "${GITHUB_REF_NAME#android-v}" app/build/outputs/release-verification

      - name: Bind signed bundle to the successful tagged build
        run: |
          python3 ../scripts/android-play.py receipt \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --tag "$GITHUB_REF_NAME" \
            --out app/build/outputs/release-verification/build.json
          cd app/build/outputs/release-verification
          sha256sum build.json >> SHA256SUMS

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Mapping File
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt.gz

      - name: Upload Release verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-verification
          path: android/app/build/outputs/release-verification/
          if-no-files-found: ignore

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md
          else
            echo "Release $VERSION" > /tmp/release-notes.md
          fi
          CORPUS_VERSION=$(node -p "require('../tests/compatibility/corpus-v1.json').corpusVersion")
          {
            echo
            echo "## Automated release evidence"
            echo
            echo "- Tagged workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Compatibility corpus: \`${CORPUS_VERSION}\`"
            echo "- Exact APK/AAB/mapping hashes: attached \`SHA256SUMS\`"
            echo "- Phone/Chromebook testbeds: advisory and recorded separately; CI does not report them as passed"
          } >> /tmp/release-notes.md

      - name: Publish immutable GitHub release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt.gz \
            app/build/outputs/release-verification/SHA256SUMS \
            app/build/outputs/release-verification/build.json
